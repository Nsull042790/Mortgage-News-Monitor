name: Breaking News Monitor

on:
  schedule:
    # Runs every 30 minutes during business hours (6am-8pm ET)
    # GitHub uses UTC, so 6am-8pm ET = 11:00-01:00 UTC (roughly)
    # These crons cover weekday business hours:
    - cron: '0,30 11-23 * * 1-5'   # 6am-7pm ET on weekdays
    - cron: '0,30 0 * * 2-6'       # 7pm-8pm ET (next day UTC) on weekdays
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-breaking-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous database
        uses: dawidd6/action-download-artifact@v3
        with:
          name: news-database
          path: ./data/
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Check for breaking news
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          TIMEZONE: America/New_York
          DATABASE_PATH: ./data/mortgage_news.db
        run: python main.py breaking

      - name: Upload database for persistence
        uses: actions/upload-artifact@v4
        with:
          name: news-database
          path: ./data/mortgage_news.db
          retention-days: 7
